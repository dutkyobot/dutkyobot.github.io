<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>코드 실행기 | Dutkyobot</title>

    <link rel="icon" href="img/favicon.png" type="image/png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CodeMirror: 코드 에디터 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: "#000000",
                        surface: "#18181B",
                        line: "#2A2A2E",
                        mute: "#9B9BA3",
                        ink: "#FFFFFF",
                        mint: "#21D67A",
                        blue: "#3B9EFF",
                        discord: "#5865F2",
                    },
                    fontFamily: {
                        sans: ["Pretendard Variable", "Pretendard", "sans-serif"],
                        mono: ["JetBrains Mono", "SF Mono", "Menlo", "monospace"],
                    },
                },
            },
        };
    </script>

    <style>
        :root {
            --c-mint: #21D67A;
            --c-blue: #3B9EFF;
            --c-red: #EF4444;
            --c-amber: #F5A623;

            --dur-header: 0.5s;
            --ease-header: cubic-bezier(0.22, 1, 0.36, 1);
        }

        html { scroll-behavior: smooth; }

        body {
            background-color: #000000;
            color: #FFFFFF;
        }

        a:focus-visible, button:focus-visible, [tabindex]:focus-visible {
            outline: 2px solid var(--c-blue);
            outline-offset: 2px;
            border-radius: 4px;
        }

        /* ==========================================================
           헤더: 스크롤에 따라 풀와이드 바 <-> 플로팅 알약으로 전환
           (원본 사이트 헤더와 동일한 구조/타이밍)
        ========================================================== */
        #site-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            display: flex;
            justify-content: center;
            padding: 0;
            transition: padding var(--dur-header) var(--ease-header);
        }

        #header-inner {
            width: 100%;
            max-width: 100%;
            height: 4rem;
            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0;

            transition: all var(--dur-header) var(--ease-header);
        }

        #header-content {
            width: 100%;
            max-width: 64rem;
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #site-header.is-floating { padding: 1rem; }

        #site-header.is-floating #header-inner {
            max-width: 64rem;
            border-radius: 9999px;
            background: linear-gradient(180deg, rgba(30, 30, 34, 0.65) 0%, rgba(24, 24, 27, 0.65) 100%);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow:
                0 16px 32px -8px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                inset 0 -1px 0 rgba(255, 255, 255, 0.02);
        }

        /* ==========================================================
           공통 컴포넌트 (원본과 동일한 토큰)
        ========================================================== */
        .card {
            background: #18181B;
            border: 1px solid #2A2A2E;
            border-radius: 28px;
            transition: border-color 0.2s ease;
        }
        .card:hover { border-color: rgba(255, 255, 255, 0.3); }

        .eyebrow-label {
            font-size: 11px;
            font-weight: 600;
            color: #9B9BA3;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .gradient-brand { background: linear-gradient(135deg, var(--c-mint) 0%, var(--c-blue) 100%); }

        .invite-btn, .run-btn { transition: opacity 0.2s ease, transform 0.1s ease; }
        .invite-btn:hover, .run-btn:hover { opacity: 0.88; }
        .run-btn:active { transform: scale(0.97); }

        .pulse-badge { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

        /* ==========================================================
           플레이그라운드 내부 패널
        ========================================================== */
        .panel-inner {
            background: #000000;
            border: 1px solid #2A2A2E;
            border-radius: 18px;
        }

        .lang-tab {
            font-size: 13px;
            font-weight: 600;
            color: #9B9BA3;
            padding: 0.5rem 0.9rem;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 0.45rem;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
            white-space: nowrap;
        }
        .lang-tab:hover { color: #FFFFFF; background: rgba(255,255,255,0.05); }
        .lang-tab.active { color: #FFFFFF; background: rgba(255,255,255,0.08); }
        .lang-dot { width: 7px; height: 7px; border-radius: 999px; flex: none; }
        .dot-html { background: #F5A623; }
        .dot-css  { background: #3B9EFF; }
        .dot-js   { background: #21D67A; }

        /* ==========================================================
           에디터 / 프리뷰 레이아웃
        ========================================================== */
        .editor-pane { position: relative; height: 100%; }

        .CodeMirror {
            height: 100% !important;
            background: #000000 !important;
            color: #E4E4E7 !important;
            font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace !important;
            font-size: 13.5px;
            line-height: 1.75;
            letter-spacing: -0.1px;
            padding: 10px 0;
        }
        .CodeMirror-gutters { background: #000000 !important; border-right: 1px solid #202024 !important; }
        .CodeMirror-linenumber { color: #46464D !important; padding: 0 12px 0 8px !important; }
        .CodeMirror-activeline-background { background: rgba(255,255,255,0.035) !important; }
        .CodeMirror-cursor { border-left: 1.5px solid #21D67A !important; }
        .CodeMirror-matchingbracket { color: #21D67A !important; font-weight: 700; text-decoration: none !important; }
        .CodeMirror-selected { background: rgba(59,158,255,0.18) !important; }
        .CodeMirror-scrollbar-filler { background: transparent !important; }

        /* 브랜드 색상에 맞춘 커스텀 문법 강조 테마 (가독성 우선) */
        .cm-s-dutkyobot .cm-keyword   { color: #3B9EFF; font-weight: 600; }
        .cm-s-dutkyobot .cm-atom      { color: #21D67A; }
        .cm-s-dutkyobot .cm-number    { color: #F5A623; }
        .cm-s-dutkyobot .cm-def       { color: #E4E4E7; }
        .cm-s-dutkyobot .cm-variable  { color: #E4E4E7; }
        .cm-s-dutkyobot .cm-variable-2{ color: #7DD3FC; }
        .cm-s-dutkyobot .cm-variable-3{ color: #7DD3FC; }
        .cm-s-dutkyobot .cm-property  { color: #7DD3FC; }
        .cm-s-dutkyobot .cm-operator  { color: #9B9BA3; }
        .cm-s-dutkyobot .cm-comment   { color: #5C5C64; font-style: italic; }
        .cm-s-dutkyobot .cm-string    { color: #21D67A; }
        .cm-s-dutkyobot .cm-string-2  { color: #21D67A; }
        .cm-s-dutkyobot .cm-meta      { color: #9B9BA3; }
        .cm-s-dutkyobot .cm-qualifier { color: #F5A623; }
        .cm-s-dutkyobot .cm-builtin   { color: #3B9EFF; }
        .cm-s-dutkyobot .cm-bracket   { color: #6B6B75; }
        .cm-s-dutkyobot .cm-tag       { color: #F5A623; font-weight: 600; }
        .cm-s-dutkyobot .cm-attribute { color: #7DD3FC; }
        .cm-s-dutkyobot .cm-hr        { color: #6B6B75; }
        .cm-s-dutkyobot .cm-link      { color: #3B9EFF; }
        .cm-s-dutkyobot .cm-error     { color: #EF4444; }

        .code-editor-wrap { display: none; height: 100%; }
        .code-editor-wrap.active { display: block; }

        #resizer {
            cursor: col-resize;
            flex: none;
            width: 14px;
            margin: 0 -3px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 5;
        }
        #resizer::after {
            content: "";
            width: 3px;
            height: 36px;
            border-radius: 999px;
            background: #2A2A2E;
            transition: background 0.15s ease;
        }
        #resizer:hover::after, #resizer.dragging::after { background: #3B9EFF; }

        #preview-frame { width: 100%; height: 100%; background: #FFFFFF; border: none; display: block; }

        /* ==========================================================
           콘솔
        ========================================================== */
        #console-panel {
            border-top: 1px solid #202024;
            background: #050506;
            flex: none;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #console-body {
            overflow-y: auto;
            font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
            font-size: 12.5px;
            line-height: 1.7;
        }
        .console-empty { padding: 14px; color: #4B4B52; font-size: 12px; }
        .console-row {
            padding: 6px 14px;
            border-bottom: 1px solid rgba(255,255,255,0.035);
            white-space: pre-wrap;
            word-break: break-word;
            display: flex;
            gap: 10px;
        }
        .console-row .tag {
            flex: none; font-size: 10px; font-weight: 700; padding: 1px 6px;
            border-radius: 5px; height: fit-content; letter-spacing: 0.03em;
            font-family: "Pretendard Variable", sans-serif;
        }
        .console-row.log .tag { background: rgba(255,255,255,0.08); color: #C7C7CC; }
        .console-row.info .tag { background: rgba(59,158,255,0.15); color: #3B9EFF; }
        .console-row.warn { background: rgba(245,166,35,0.05); }
        .console-row.warn .tag { background: rgba(245,166,35,0.18); color: #F5A623; }
        .console-row.error { background: rgba(239,68,68,0.06); }
        .console-row.error .tag { background: rgba(239,68,68,0.18); color: #EF4444; }
        .console-row .msg { color: #D4D4D8; flex: 1; }
        .console-row.error .msg { color: #FCA5A5; }
        .console-row.warn .msg { color: #FBD38D; }

        .switch { position: relative; width: 34px; height: 20px; flex: none; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .switch-track { position: absolute; inset: 0; background: #2A2A2E; border-radius: 999px; transition: background 0.15s ease; cursor: pointer; }
        .switch-track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: #fff; border-radius: 999px; transition: transform 0.15s ease; }
        .switch input:checked + .switch-track { background: #21D67A; }
        .switch input:checked + .switch-track::after { transform: translateX(14px); }

        .icon-btn {
            width: 32px; height: 32px; border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            color: #9B9BA3; border: 1px solid transparent;
            transition: all 0.15s ease;
        }
        .icon-btn:hover { color: #fff; background: rgba(255,255,255,0.06); border-color: #2A2A2E; }

        ::-webkit-scrollbar { width: 9px; height: 9px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2A2A2E; border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
        ::-webkit-scrollbar-thumb:hover { background: #3A3A40; background-clip: padding-box; }

        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(12px);
            background: #18181B; border: 1px solid #2A2A2E; color: #fff;
            padding: 10px 18px; border-radius: 12px; font-size: 13px; font-weight: 600;
            box-shadow: 0 12px 28px rgba(0,0,0,0.5);
            opacity: 0; pointer-events: none; transition: all 0.2s ease; z-index: 100;
            display: flex; align-items: center; gap: 8px;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 860px) {
            .workspace-row { flex-direction: column; }
            #resizer { display: none; }
            .editor-col, .preview-col { width: 100% !important; }
            .editor-col { height: 380px; }
            .preview-col { height: 460px; }
            #playground-body { height: auto !important; }
        }

        @media (prefers-reduced-motion: reduce) {
            .pulse-badge { animation: none; }
            #site-header, #header-inner, .run-btn, * { transition: none !important; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased">

    <header id="site-header">
        <div id="header-inner">
            <div id="header-content">
                <a href="index.html" class="flex items-center space-x-2.5">
                    <div class="w-8 h-8 rounded-[0.5rem] gradient-brand flex items-center justify-center">
                        <img src="img/icon.png" alt="D-AI" class="h-5 w-5 rounded" onerror="this.style.display='none'">
                    </div>
                    <span class="text-lg font-bold tracking-tight text-ink">Dutkyobot</span>
                    <i class="fa-solid fa-chevron-right text-[10px] text-mute mx-0.5"></i>
                    <span class="text-sm font-semibold text-mute">코드 실행기</span>
                </a>

                <a href="" class="text-sm font-semibold text-mute hover:text-ink transition-colors">
                    사이트 개편 중
                </a>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-5xl mx-auto w-full px-6 pt-32 pb-20 sm:pt-36 sm:pb-28">

        <!-- ============================== 인트로 ============================== -->
        <div class="mb-6">
            <span class="eyebrow-label text-mint">Tools · Playground</span>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-ink leading-tight mt-2">
                코드 실행기
            </h1>
            <p class="text-[15px] text-mute mt-3 leading-relaxed max-w-lg">
                HTML, CSS, JavaScript를 브라우저에서 바로 작성하고 실행해 결과를 확인하세요.
            </p>

            <div class="mt-8 grid grid-cols-1 sm:grid-cols-3 gap-6 sm:gap-8">
                <div>
                    <div class="eyebrow-label mb-1.5">지원 언어</div>
                    <div class="text-sm text-ink font-medium flex items-center gap-1.5">
                        <span class="lang-dot dot-html"></span>HTML
                        <span class="lang-dot dot-css ml-1"></span>CSS
                        <span class="lang-dot dot-js ml-1"></span>JS
                    </div>
                </div>
                <div>
                    <div class="eyebrow-label mb-1.5">실행 방식</div>
                    <div class="text-sm text-ink font-medium">브라우저 내 실시간 렌더링</div>
                </div>
                <div>
                    <div class="eyebrow-label mb-1.5">상태</div>
                    <div class="text-sm text-mint font-semibold flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-mint pulse-badge"></span>
                        정상 작동 중
                    </div>
                </div>
            </div>
        </div>

        <!-- ============================== 플레이그라운드 카드 ============================== -->
        <div class="card overflow-hidden">

            <!-- 툴바 -->
            <div class="flex items-center justify-between gap-2 px-4 sm:px-5 py-3 border-b border-line flex-wrap">
                <div class="flex items-center gap-1 overflow-x-auto">
                    <div class="lang-tab active" data-tab="html" id="tab-html">
                        <span class="lang-dot dot-html"></span>HTML
                    </div>
                    <div class="lang-tab" data-tab="css" id="tab-css">
                        <span class="lang-dot dot-css"></span>CSS
                    </div>
                    <div class="lang-tab" data-tab="js" id="tab-js">
                        <span class="lang-dot dot-js"></span>JavaScript
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <label class="flex items-center gap-2 text-xs font-semibold text-mute cursor-pointer select-none mr-1">
                        자동 실행
                        <span class="switch">
                            <input type="checkbox" id="autorun-toggle" checked>
                            <span class="switch-track"></span>
                        </span>
                    </label>

                    <button id="btn-reset" class="icon-btn" title="예제로 초기화"><i class="fa-solid fa-rotate-left text-xs"></i></button>
                    <button id="btn-download" class="icon-btn" title="HTML 파일로 다운로드"><i class="fa-solid fa-download text-xs"></i></button>
                    <button id="btn-fullscreen" class="icon-btn" title="미리보기 전체화면"><i class="fa-solid fa-expand text-xs"></i></button>

                    <button id="btn-run" class="run-btn gradient-brand text-black text-sm font-bold px-4 py-2 rounded-full flex items-center gap-2">
                        <i class="fa-solid fa-play text-[11px]"></i>
                        실행
                        <span class="hidden sm:inline text-[10px] font-semibold opacity-70 border-l border-black/25 pl-2 ml-0.5">⌘/Ctrl + Enter</span>
                    </button>
                </div>
            </div>

            <!-- 에디터 + 프리뷰 -->
            <div id="playground-body" class="p-3 sm:p-4" style="height: 620px;">
                <div class="workspace-row flex h-full gap-0">
                    <div class="editor-col panel-inner overflow-hidden min-h-0" style="width: 46%;">
                        <div class="editor-pane">
                            <div class="code-editor-wrap active" id="wrap-html"><textarea id="editor-html"></textarea></div>
                            <div class="code-editor-wrap" id="wrap-css"><textarea id="editor-css"></textarea></div>
                            <div class="code-editor-wrap" id="wrap-js"><textarea id="editor-js"></textarea></div>
                        </div>
                    </div>

                    <div id="resizer"></div>

                    <div class="preview-col panel-inner overflow-hidden flex-1 min-h-0 flex flex-col">
                        <iframe id="preview-frame" title="미리보기" sandbox="allow-scripts allow-modals allow-forms allow-popups allow-same-origin"></iframe>

                        <div id="console-panel" style="height: 32%;">
                            <div class="flex items-center justify-between px-3.5 py-2 border-b border-[#202024] flex-none">
                                <div class="flex items-center gap-2">
                                    <i class="fa-solid fa-terminal text-mute text-[11px]"></i>
                                    <span class="eyebrow-label">콘솔</span>
                                    <span id="console-count" class="text-[10px] font-semibold text-mute bg-white/5 px-1.5 py-0.5 rounded-full hidden"></span>
                                </div>
                                <div class="flex items-center gap-1">
                                    <button id="btn-clear-console" class="icon-btn" style="width:26px;height:26px;" title="콘솔 지우기"><i class="fa-solid fa-ban text-[11px]"></i></button>
                                    <button id="btn-collapse-console" class="icon-btn" style="width:26px;height:26px;" title="콘솔 접기/펼치기"><i class="fa-solid fa-chevron-down text-[11px]"></i></button>
                                </div>
                            </div>
                            <div id="console-body" class="flex-1"><div class="console-empty">콘솔 출력이 여기에 표시됩니다.</div></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <p class="text-xs text-mute mt-4 text-center">모든 코드는 브라우저에만 저장되며 외부로 전송되지 않습니다.</p>
    </main>

    <footer class="py-9 border-t border-line mt-auto">
        <div class="max-w-5xl mx-auto px-6 flex flex-col sm:flex-row justify-center sm:justify-between items-center text-mute text-sm gap-4">
            <div class="flex items-center gap-2">
                <span class="font-bold text-ink">Dutkyobot</span>
                <span>&copy; 2026. All Rights Reserved.</span>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-xs">Powered by Dutkyobot</span>
            </div>
        </div>
    </footer>

    <div class="toast" id="toast"></div>

    <script>
    /* ========================================================== 헤더 ========================================================== */
    (function initHeader() {
        var header = document.getElementById("site-header");
        if (!header) return;
        window.addEventListener("scroll", function () {
            header.classList.toggle("is-floating", window.scrollY > 20);
        }, { passive: true });
    })();

    /* ========================================================== 토스트 ========================================================== */
    var toastEl = document.getElementById("toast");
    var toastTimer;
    function showToast(msg, icon) {
        toastEl.innerHTML = (icon ? '<i class="' + icon + ' text-mint text-xs"></i>' : '') + '<span>' + msg + '</span>';
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1800);
    }

    /* ========================================================== 기본 예제 ========================================================== */
    var DEFAULT_HTML = '<div class="box">\n  <h1>Hello, Dutkyobot 👋</h1>\n  <p>왼쪽에서 코드를 수정하고 <b>실행</b> 버튼을 눌러보세요.</p>\n  <button id="btn">클릭 카운트: <span id="count">0</span></button>\n</div>';
    var DEFAULT_CSS = 'body {\n  font-family: -apple-system, sans-serif;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  min-height: 100vh;\n  margin: 0;\n  background: radial-gradient(circle at 30% 20%, #e9fff4, #eaf4ff);\n}\n\n.box {\n  text-align: center;\n  padding: 2.5rem;\n}\n\nh1 { margin: 0 0 .5rem; color: #111; }\np { color: #555; }\n\nbutton {\n  margin-top: 1rem;\n  padding: .7rem 1.4rem;\n  border: none;\n  border-radius: 999px;\n  background: linear-gradient(135deg, #21D67A, #3B9EFF);\n  color: #fff;\n  font-weight: 700;\n  cursor: pointer;\n}';
    var DEFAULT_JS = 'let count = 0;\nconst btn = document.getElementById("btn");\nconst countEl = document.getElementById("count");\n\nbtn.addEventListener("click", () => {\n  count++;\n  countEl.textContent = count;\n  console.log("클릭됨:", count);\n  if (count === 5) {\n    console.warn("5번 클릭했어요!");\n  }\n});\n\nconsole.log("스크립트가 로드되었습니다.");';

    var STORAGE_KEY = "dutkyobot_code_executor_v1";

    /* ========================================================== CodeMirror 초기화 ========================================================== */
    var cmOptions = {
        theme: "dutkyobot",
        lineNumbers: true,
        autoCloseBrackets: true,
        autoCloseTags: true,
        matchBrackets: true,
        styleActiveLine: true,
        indentUnit: 2,
        tabSize: 2,
        lineWrapping: true,
    };

    var editors = {};
    editors.html = CodeMirror.fromTextArea(document.getElementById("editor-html"), Object.assign({ mode: "htmlmixed" }, cmOptions));
    editors.css  = CodeMirror.fromTextArea(document.getElementById("editor-css"),  Object.assign({ mode: "css" }, cmOptions));
    editors.js   = CodeMirror.fromTextArea(document.getElementById("editor-js"),   Object.assign({ mode: "javascript" }, cmOptions));

    function loadSaved() {
        try {
            var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
            if (saved && (saved.html || saved.css || saved.js)) {
                editors.html.setValue(saved.html || "");
                editors.css.setValue(saved.css || "");
                editors.js.setValue(saved.js || "");
                return;
            }
        } catch (e) {}
        editors.html.setValue(DEFAULT_HTML);
        editors.css.setValue(DEFAULT_CSS);
        editors.js.setValue(DEFAULT_JS);
    }
    loadSaved();

    function saveCode() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                html: editors.html.getValue(), css: editors.css.getValue(), js: editors.js.getValue(),
            }));
        } catch (e) {}
    }

    /* ========================================================== 탭 전환 ========================================================== */
    var tabs = document.querySelectorAll(".lang-tab");
    var wraps = { html: document.getElementById("wrap-html"), css: document.getElementById("wrap-css"), js: document.getElementById("wrap-js") };
    tabs.forEach(function (tab) {
        tab.addEventListener("click", function () {
            var key = tab.getAttribute("data-tab");
            tabs.forEach(function (t) { t.classList.remove("active"); });
            Object.values(wraps).forEach(function (w) { w.classList.remove("active"); });
            tab.classList.add("active");
            wraps[key].classList.add("active");
            setTimeout(function () { editors[key].refresh(); editors[key].focus(); }, 0);
        });
    });

    /* ========================================================== 콘솔 캡처 ========================================================== */
    var consoleBody = document.getElementById("console-body");
    var consoleCount = document.getElementById("console-count");
    var errCount = 0;

    function addConsoleRow(type, args) {
        var empty = consoleBody.querySelector(".console-empty");
        if (empty) empty.remove();

        var row = document.createElement("div");
        row.className = "console-row " + type;

        var tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = type === "log" ? "LOG" : type === "info" ? "INFO" : type === "warn" ? "WARN" : "ERROR";

        var msg = document.createElement("span");
        msg.className = "msg";
        msg.textContent = args.join(" ");

        row.appendChild(tag);
        row.appendChild(msg);
        consoleBody.appendChild(row);
        consoleBody.scrollTop = consoleBody.scrollHeight;

        if (type === "error") {
            errCount++;
            consoleCount.textContent = errCount + "개 오류";
            consoleCount.classList.remove("hidden");
            consoleCount.style.color = "#EF4444";
            consoleCount.style.background = "rgba(239,68,68,0.15)";
        }
    }

    window.addEventListener("message", function (e) {
        if (!e.data || e.data.__source !== "dutkyobot-preview") return;
        if (e.data.type === "console") addConsoleRow(e.data.level, e.data.args);
        else if (e.data.type === "error") addConsoleRow("error", [e.data.message + (e.data.line ? "  (줄 " + e.data.line + ")" : "")]);
    });

    function clearConsole() {
        consoleBody.innerHTML = '<div class="console-empty">콘솔 출력이 여기에 표시됩니다.</div>';
        errCount = 0;
        consoleCount.classList.add("hidden");
    }
    document.getElementById("btn-clear-console").addEventListener("click", clearConsole);

    var consolePanel = document.getElementById("console-panel");
    var collapseBtn = document.getElementById("btn-collapse-console");
    var consoleCollapsed = false;
    collapseBtn.addEventListener("click", function () {
        consoleCollapsed = !consoleCollapsed;
        consolePanel.style.height = consoleCollapsed ? "38px" : "32%";
        consoleBody.style.display = consoleCollapsed ? "none" : "block";
        collapseBtn.querySelector("i").className = consoleCollapsed ? "fa-solid fa-chevron-up text-[11px]" : "fa-solid fa-chevron-down text-[11px]";
    });

    /* ========================================================== 실행 ========================================================== */
    var frame = document.getElementById("preview-frame");

    var CONSOLE_BRIDGE = '\
        <script>\
        (function(){\
            var send = function(level, args) {\
                try {\
                    parent.postMessage({ __source: "dutkyobot-preview", type: "console", level: level,\
                        args: args.map(function(a){\
                            try { if (a instanceof Error) return a.message; return typeof a === "object" ? JSON.stringify(a) : String(a); }\
                            catch(e){ return String(a); }\
                        }) }, "*");\
                } catch(e) {}\
            };\
            ["log","info","warn","error"].forEach(function(level){\
                var orig = console[level];\
                console[level] = function(){ send(level, Array.prototype.slice.call(arguments)); orig.apply(console, arguments); };\
            });\
            window.addEventListener("error", function(e){\
                parent.postMessage({ __source: "dutkyobot-preview", type: "error", message: e.message, line: e.lineno }, "*");\
            });\
            window.addEventListener("unhandledrejection", function(e){\
                parent.postMessage({ __source: "dutkyobot-preview", type: "error", message: "Uncaught (in promise) " + (e.reason && e.reason.message ? e.reason.message : e.reason) }, "*");\
            });\
        })();\
        <\/script>\
    ';

    function buildDoc() {
        var html = editors.html.getValue();
        var css = editors.css.getValue();
        var js = editors.js.getValue();
        return '<!DOCTYPE html><html><head><meta charset="UTF-8">' + CONSOLE_BRIDGE +
            '<style>' + css + '</style></head><body>' + html +
            '<script>try{\n' + js + '\n}catch(e){console.error(e.message);}<\/script>' +
            '</body></html>';
    }

    function runCode() {
        clearConsole();
        frame.srcdoc = buildDoc();
        saveCode();
    }
    document.getElementById("btn-run").addEventListener("click", runCode);

    var autorunToggle = document.getElementById("autorun-toggle");
    var debounceTimer;
    function scheduleAutorun() {
        if (!autorunToggle.checked) return;
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(runCode, 700);
    }
    [editors.html, editors.css, editors.js].forEach(function (ed) { ed.on("change", scheduleAutorun); });

    document.addEventListener("keydown", function (e) {
        if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); runCode(); }
    });

    /* ========================================================== 초기화 / 다운로드 / 전체화면 ========================================================== */
    document.getElementById("btn-reset").addEventListener("click", function () {
        if (!confirm("현재 코드를 지우고 기본 예제로 되돌릴까요?")) return;
        editors.html.setValue(DEFAULT_HTML);
        editors.css.setValue(DEFAULT_CSS);
        editors.js.setValue(DEFAULT_JS);
        runCode();
        showToast("기본 예제로 초기화했습니다", "fa-solid fa-rotate-left");
    });

    document.getElementById("btn-download").addEventListener("click", function () {
        var blob = new Blob([buildDoc().replace(CONSOLE_BRIDGE, "")], { type: "text/html" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = "dutkyobot-snippet.html";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast("HTML 파일을 다운로드했습니다", "fa-solid fa-download");
    });

    document.getElementById("btn-fullscreen").addEventListener("click", function () {
        if (frame.requestFullscreen) frame.requestFullscreen();
        else if (frame.webkitRequestFullscreen) frame.webkitRequestFullscreen();
    });

    /* ========================================================== 리사이저 ========================================================== */
    var resizer = document.getElementById("resizer");
    var editorCol = document.querySelector(".editor-col");
    var isDragging = false;

    resizer.addEventListener("mousedown", function () {
        isDragging = true;
        resizer.classList.add("dragging");
        document.body.style.userSelect = "none";
    });
    window.addEventListener("mousemove", function (e) {
        if (!isDragging) return;
        var row = document.querySelector(".workspace-row");
        var rect = row.getBoundingClientRect();
        var pct = ((e.clientX - rect.left) / rect.width) * 100;
        pct = Math.min(78, Math.max(22, pct));
        editorCol.style.width = pct + "%";
        Object.values(editors).forEach(function (ed) { ed.refresh(); });
    });
    window.addEventListener("mouseup", function () {
        if (!isDragging) return;
        isDragging = false;
        resizer.classList.remove("dragging");
        document.body.style.userSelect = "";
    });

    setTimeout(runCode, 150);
    </script>

</body>
</html>
